<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Task Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // Stored choice wins; otherwise follow the OS.
      (function () {
        try {
          var saved = localStorage.getItem("ai-task-agent-theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          var dark = saved ? saved === "dark" : !prefersLight;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="ambient">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
